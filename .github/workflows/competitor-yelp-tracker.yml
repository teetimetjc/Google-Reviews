name: Competitor Yelp Tracker

# Paused: Yelp discontinued the free Fusion API tier. It's now a paid
# subscription starting at $229/month (Base plan) plus per-call overages —
# a 30-day trial with 5,000 free calls is all that's actually free. No
# `schedule:` trigger for now so this doesn't fail weekly for a plan we're
# not paying for — still runnable manually from the Actions tab if that
# ever changes.
on:
  workflow_dispatch: {}

jobs:
  competitor-yelp-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Snapshot competitor Yelp listings
        env:
          SHEETS_SPREADSHEET_ID: '1Z9LMHgyGm3VEI3TojUxfUg6c01MI5CMLmUmnSUl-nCw'
          GOOGLE_SHEETS_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_KEY }}
          YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
        run: npm run competitor-yelp-tracker
